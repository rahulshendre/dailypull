name: Daily build

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC; keep in sync with REFRESH_UTC in pipeline/config.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore links shown in the last 14 days
        uses: actions/cache/restore@v4
        with:
          path: .cache/history.json
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Build today's list
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m pipeline.build

      - name: Save history
        uses: actions/cache/save@v4
        with:
          path: .cache/history.json
          key: history-${{ github.run_id }}

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

      # Off until a VERCEL_TOKEN secret exists. Any static host works: see README.
      - name: Deploy to Vercel
        if: env.HAS_VERCEL == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"
