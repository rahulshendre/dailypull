name: Daily build

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC; keep in sync with REFRESH_UTC in pipeline/config.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore links shown in the last 14 days
        uses: actions/cache/restore@v4
        with:
          path: .cache/history.json
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Build today's list
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m pipeline.build

      - name: Save history
        uses: actions/cache/save@v4
        with:
          path: .cache/history.json
          key: history-${{ github.run_id }}

      - name: Read the Pages base path
        id: pages
        uses: actions/configure-pages@v6

      # 404.html is served at any depth, so its links are absolute. On a project site
      # (user.github.io/dailypull) they need the /dailypull prefix; on a custom domain it is empty.
      - name: Point the 404 page at the base path
        run: sed -i -E 's#(href|src)="/#\1="${{ steps.pages.outputs.base_path }}/#g' site/404.html

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
